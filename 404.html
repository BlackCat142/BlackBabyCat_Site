<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#8b5cf6">
  <title>Страница не найдена — TheWitcheryCat</title>
  <!-- Пути абсолютные: GitHub Pages показывает эту страницу по любому неверному адресу -->
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="/style.css" />
  <style>
    .not-found { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 18px; }
    .not-found img { width: 140px; height: 140px; border-radius: 50%; background: #fff; box-shadow: 0 0 40px rgba(139, 92, 246, 0.45); }
    .not-found .code { font-size: clamp(4rem, 14vw, 7rem); font-weight: 800; line-height: 1; margin: 0;
      background: var(--gradient-primary); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .not-found h1 { margin: 0; font-size: clamp(1.3rem, 4vw, 1.8rem); }
    .not-found p { color: var(--text-light); max-width: 460px; margin: 0; line-height: 1.6; }
    .not-found nav { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  </style>
</head>
<body data-theme="dark">
  <script>try { document.body.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}</script>
  <main class="not-found">
    <img src="/icons/logo.png" alt="Логотип TheWitcheryCat" width="140" height="140">
    <p class="code">404</p>
    <h1>Кот утащил эту страницу</h1>
    <p>Такой страницы нет — возможно, ссылка устарела или в адресе опечатка. Загляните в разделы сайта:</p>
    <nav>
      <a class="btn btn-gradient" href="/">На главную</a>
      <a class="btn" href="/#портфолио">Релизы</a>
      <a class="btn" href="/moon/">Лунный календарь</a>
      <a class="btn" href="/textpesen">Тексты песен</a>
    </nav>
  </main>
</body>
</html>
